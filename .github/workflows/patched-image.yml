name: Build and Publish Patched hbbs/hbbr Image

# Builds a rustdesk-server (classic) image from this fork and pushes it to GHCR.
#
# This fork carries exactly one change over upstream rustdesk/rustdesk-server:
# the server-side secure_tcp key exchange (upstream PR #706). Source, submodule
# pin and runtime layout are upstream, so the image stays in line with the
# official one apart from that patch.
#
# The image is built by docker-musl/Dockerfile, which compiles the binaries as
# statically linked musl inside rust:alpine and packages them into a FROM
# scratch image -- the same shape as upstream's classic image. Doing the whole
# build inside one docker build avoids the host-toolchain problems that broke
# the earlier cargo and cross approaches (glibc-dynamic binaries cannot exec in
# a scratch rootfs, and cross's musl image ships no static OpenSSL).

on:
  push:
    branches: [ "secure-tcp-keyexchange" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rustdesk-server

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=secure-tcp

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker-musl/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
